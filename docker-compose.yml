services:
  # SQL Server 2022 Express — dev database. Already running as mechanicshop-sql.
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env (copy .env.example)}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -N -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # The API: JWT auth, EF Core + SQL Server, Swagger at /swagger.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: mechanic-shop-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MechanicShop: "Server=sql,1433;Database=MechanicShop;User Id=sa;Password=${SQL_PASSWORD:?Set SQL_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False"
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (>= 32 random chars)}
      JwtSettings__Issuer: MechanicShop
      JwtSettings__Audience: MechanicShopPortal
      Seed__ManagerEmail: manager@mechanicshop.dev
      Seed__ManagerPassword: ${MANAGER_PASSWORD:?Set MANAGER_PASSWORD in .env}
      Seed__DemoData: ${DEMO_SEED_DATA:-false}
      AISettings__Provider: ${AI_PROVIDER:-Mock}
      AISettings__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      AISettings__OpenAI__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AISettings__OpenAI__Model: ${OPENAI_MODEL:-gpt-4o-mini}
      Swagger__Enabled: "true"
      # CORS origins for the SPA. Allowed: localhost (docker SPA) + the dev
      # ng-serve port + the API port + their 127.0.0.1 loopback equivalents.
      Cors__AllowedOrigins__0: http://localhost
      Cors__AllowedOrigins__1: http://localhost:4200
      Cors__AllowedOrigins__2: http://localhost:5255
      Cors__AllowedOrigins__3: http://127.0.0.1
      Cors__AllowedOrigins__4: http://127.0.0.1:4200
      Cors__AllowedOrigins__5: http://127.0.0.1:5255
      # Google OAuth (Sign in with Google). Optional — see GoogleOAuth.md for setup.
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-}
      GoogleAuth__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost}
    ports:
      - "5255:8080"
    depends_on:
      sql:
        condition: service_healthy
    restart: unless-stopped

  # The customer portal (Angular + nginx). /api calls proxied to the api container.
  spa:
    build:
      context: .
      dockerfile: Dockerfile.spa
    image: mechanic-shop-spa:latest
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  sql-data:
