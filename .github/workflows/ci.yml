name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MechanicShop.slnx
      - run: dotnet build MechanicShop.slnx -c Release --no-restore
      - run: dotnet test MechanicShop.slnx -c Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MechanicShop.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MechanicShop.Web/package-lock.json
      - run: npm ci
      - run: npm run build
