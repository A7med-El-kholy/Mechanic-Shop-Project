server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Production hardening
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow large file uploads (images up to 10MB, audio up to 25MB)
    client_max_body_size 32m;
    client_body_buffer_size 128k;

    # Proxy timeouts for AI processing (can be slow)
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Proxy /api calls to backend container
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Disable buffering for streaming AI responses
        proxy_buffering off;
        proxy_cache off;
    }

    # Proxy Swagger UI
    location /swagger {
        proxy_pass http://api:8080/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy health check
    location /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA routing fallback for Angular
    location / {
        try_files $uri $uri/ /index.html;
        # The Angular shell is the browser entry point — never serve a stale
        # copy. If index.html were cached, it could reference an old
        # content-hashed bundle that 404s, leaving the page unable to mount
        # (the user would see a static, "not rich" page).
        add_header Cache-Control "no-store" always;
    }
}
