<div class="shell">
  <aside class="side">
    <div class="sideHead">
      <a class="brandLink" routerLink="/home">
        <div class="brandMark">MS</div>
        <div>
          <b>Mechanic Shop</b>
          <div class="sideSub">Staff Counter</div>
        </div>
      </a>
    </div>

    <nav class="nav">
      @for (item of nav(); track item.path) {
        <a
          class="navItem"
          [routerLink]="['/', item.path]"
          [class.on]="currentPath() === item.path || currentPath() === '' && item.path === 'dashboard'"
        >
          <span class="ico">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
          @if (item.path === 'notifications' && badge.unread() > 0) {
            <span class="badge badge--brand">{{ badge.unread() }}</span>
          }
        </a>
      }
    </nav>

    <div class="sideFoot">
      <button class="btn btn--outline btn--full" type="button" (click)="logout()">
        Sign out
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="user">
        <div class="avatar">{{ initials() }}</div>
        <div>
          <b>{{ auth.fullName() }}</b>
          <div class="sideSub muted sm">{{ auth.primaryRole() }}</div>
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
