<div class="shell">
  <aside class="side">
    <div class="sideHead">
      <div class="logo">MS</div>
      <div>
        <b>Mechanic Shop</b>
        <div class="muted sm">Staff workspace</div>
      </div>
    </div>

    <nav class="nav">
      @for (item of liveNav; track item.path) {
        <a class="navItem" [routerLink]="['/', item.path]" routerLinkActive="on">
          <span class="ico">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
          @if (item.path === 'notifications' && badge.unread() > 0) {
            <span class="navBadge">{{ badge.unread() }}</span>
          }
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="top">
      <div class="user">
        <div class="avatar">{{ initials() }}</div>
        <div>
          <b>{{ auth.fullName() }}</b>
          <div class="muted sm">{{ auth.primaryRole() }}</div>
        </div>
      </div>
      <button class="btn" type="button" (click)="logout()">Sign out</button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
