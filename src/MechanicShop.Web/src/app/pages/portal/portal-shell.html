<div class="portal">
  <header class="appHeader">
    <div class="appHeader__inner">
      <a class="brand" routerLink="/home">
        <div class="brandMark">MS</div>
        <div>
          <b>Mechanic Shop</b>
          <div class="brandSub">Customer Portal</div>
        </div>
      </a>

      <nav class="mainNav">
        @for (item of portalNav; track item.path) {
          <a
            class="navLink"
            [routerLink]="['/' + item.path]"
            [class.navLink--active]="isActive(item.path)"
          >
            {{ item.label }}
            @if (item.path === 'portal/notifications' && badge.unread() > 0) {
              <span class="badge badge--neutral" style="padding:2px 6px">{{ badge.unread() }}</span>
            }
          </a>
        }
      </nav>

      <div class="navActions">
        <div class="userBadge">
          <div class="userAvatar">{{ initials() }}</div>
          <div>
            <b>{{ auth.fullName() }}</b>
            <div class="brandSub">Customer</div>
          </div>
        </div>
        <button class="btn btn--outline btn--sm" type="button" (click)="logout()">
          Sign out
        </button>
      </div>
    </div>
  </header>

  <main class="portalMain">
    <router-outlet />
  </main>
</div>
