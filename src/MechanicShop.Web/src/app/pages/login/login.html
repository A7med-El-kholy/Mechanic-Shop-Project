<div class="wrap">
  <div class="brand">
    <div class="logo">MS</div>
    <p class="muted">Workshop management for staff — sign in with your shop account.</p>
  </div>

  <form class="card form" (ngSubmit)="submit()">
    <h1 class="title">Sign in</h1>

    <label class="field">
      <span>Email</span>
      <input
        class="input"
        type="email"
        autocomplete="username"
        placeholder="manager@mechanicshop.dev"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        [disabled]="auth.busy()"
        required>
    </label>

    <label class="field">
      <span>Password</span>
      <input
        class="input"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••••"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [disabled]="auth.busy()"
        required>
    </label>

    @if (error(); as msg) {
      <div class="al al--err">{{ msg }}</div>
    }

    <button class="btn btn--brand wide" type="submit" [disabled]="auth.busy()">
      {{ auth.busy() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
