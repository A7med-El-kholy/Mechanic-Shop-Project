server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API lives on a sibling container ("api:8080"); proxying keeps
    # the browser on a single origin, so no CORS configuration is needed.
    location /api {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Angular HTML5 history mode: every client-side route falls back to
    # index.html so refreshing /portal/ai-assistant works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
